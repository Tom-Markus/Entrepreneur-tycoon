<!doctype html>
<html lang="fr-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrepreneur Tycoon (Belgique)</title>
  <meta name="description" content="Crée ton entreprise belge, survis au fisc et atteins la liberté financière. Jeu de gestion en pixel art.">
  <meta name="theme-color" content="#1b1d2b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%231b1d2b'/%3E%3Crect x='2' y='1' width='4' height='6' fill='%23f2c14e'/%3E%3Crect x='3' y='2' width='2' height='4' fill='%23d08c2c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app" aria-live="polite">
    <noscript>Ce jeu nécessite JavaScript.</noscript>
    <p class="boot">Chargement…</p>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <script>
    // Les modules ES sont bloqués en file:// : on charge alors le bundle classique.
    (function () {
      var s = document.createElement('script');
      if (location.protocol === 'file:') {
        s.src = 'dist/tycoon.bundle.js';
      } else {
        s.type = 'module';
        s.src = 'src/main.js';
      }
      s.onerror = function () {
        document.querySelector('.boot').textContent = 'Impossible de charger le jeu.';
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
